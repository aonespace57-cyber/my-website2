media:
  input: images
  output: /images
  extensions: [jpg, jpeg, png, webp, gif]
  rename: random

content:
  - name: featured
    label: 대표 사진
    type: file
    path: content/featured.json
    format: json
    fields:
      - name: hero
        label: 첫 화면 오른쪽 사진
        type: object
        fields:
          - name: image
            label: 사진 선택 또는 업로드
            type: image
            required: true
          - name: alt
            label: 사진 설명
            type: string
            required: true
      - name: signature
        label: 설계·시공 소개 사진
        type: object
        fields:
          - name: image
            label: 사진 선택 또는 업로드
            type: image
            required: true
          - name: alt
            label: 사진 설명
            type: string
            required: true
  - name: case-all
    label: 시공사례 대표 사진
    type: file
    path: content/case-all.json
    format: json
    fields:
      - name: photos
        label: 사진 목록
        description: 항목을 추가하거나 삭제하고 드래그로 순서를 바꾼 뒤 저장하세요. 사진 개수에는 제한이 없습니다.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: image
            label: 사진 선택 또는 업로드
            type: image
            required: true
          - name: alt
            label: 사진 설명
            type: string
            required: true
          - name: caption
            label: 사진 위 이름표 (선택)
            type: string
  - name: case-block
